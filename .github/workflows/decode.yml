name: Decode base64 images
on:
  push:
    paths:
      - '**.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode
        run: |
          set -e
          for f in $(git ls-files '*.b64'); do
            base64 -d "$f" > "${f%.b64}"
            git rm -q "$f"
            git add "${f%.b64}"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "Decode base64 images"
          git push
